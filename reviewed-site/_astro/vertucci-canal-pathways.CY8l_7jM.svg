<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Vertucci canal pathways</title>
  <desc id="description">Original EndoTech schematic showing four examples from the eight classic Vertucci canal configurations.</desc>
  <rect width="1200" height="630" fill="#f7fbfa"/>
  <path d="M0 0h1200v10H0z" fill="#087f83"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="72" y="90" fill="#087f83" font-size="18" font-weight="800" letter-spacing="3">CLINICAL ANATOMY</text>
    <text x="72" y="155" fill="#102b3b" font-size="48" font-weight="760" letter-spacing="-1.5">Read the route before you shape.</text>
    <text x="72" y="196" fill="#5c707d" font-size="22">Eight classic Vertucci configurations, drawn from chamber to apex.</text>

    <g transform="translate(72 246)">
      <rect width="242" height="292" rx="18" fill="#ffffff" stroke="#d8e5e4"/>
      <text x="22" y="35" fill="#087f83" font-size="15" font-weight="800" letter-spacing="2">TYPE I</text>
      <text x="193" y="36" fill="#176b6e" font-size="17" font-weight="800">1-1</text>
      <g transform="translate(41 48) scale(.72)">
        <path d="M47 13C35 31 34 55 40 84l17 150c2 17 12 26 23 26s21-9 23-26l17-150c6-29 5-53-7-71-18 9-48 9-66 0z" fill="#edf3f3" stroke="#91aeb1" stroke-width="2.5"/>
        <path d="M63 38q17-11 34 0l-4 25Q80 76 67 63z" fill="#d5e7e5" stroke="#7c9ea0" stroke-width="2"/>
        <path d="M80 62c0 46 0 128 0 185" fill="none" stroke="#087f83" stroke-width="7" stroke-linecap="round"/>
        <circle cx="80" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="80" cy="247" r="6" fill="#fff" stroke="#c7554b" stroke-width="3"/>
      </g>
      <text x="22" y="270" fill="#526778" font-size="15" font-weight="700">One canal, one exit</text>
    </g>

    <g transform="translate(334 246)">
      <rect width="242" height="292" rx="18" fill="#ffffff" stroke="#d8e5e4"/>
      <text x="22" y="35" fill="#087f83" font-size="15" font-weight="800" letter-spacing="2">TYPE II</text>
      <text x="193" y="36" fill="#176b6e" font-size="17" font-weight="800">2-1</text>
      <g transform="translate(41 48) scale(.72)">
        <path d="M47 13C35 31 34 55 40 84l17 150c2 17 12 26 23 26s21-9 23-26l17-150c6-29 5-53-7-71-18 9-48 9-66 0z" fill="#edf3f3" stroke="#91aeb1" stroke-width="2.5"/>
        <path d="M63 38q17-11 34 0l-4 25Q80 76 67 63z" fill="#d5e7e5" stroke="#7c9ea0" stroke-width="2"/>
        <path d="M67 62c1 39 4 64 13 85v100M93 62c-1 39-4 64-13 85" fill="none" stroke="#087f83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="67" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="93" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="80" cy="247" r="6" fill="#fff" stroke="#c7554b" stroke-width="3"/>
      </g>
      <text x="22" y="270" fill="#526778" font-size="15" font-weight="700">Two canals converge</text>
    </g>

    <g transform="translate(596 246)">
      <rect width="242" height="292" rx="18" fill="#ffffff" stroke="#d8e5e4"/>
      <text x="22" y="35" fill="#087f83" font-size="15" font-weight="800" letter-spacing="2">TYPE III</text>
      <text x="177" y="36" fill="#176b6e" font-size="17" font-weight="800">1-2-1</text>
      <g transform="translate(41 48) scale(.72)">
        <path d="M47 13C35 31 34 55 40 84l17 150c2 17 12 26 23 26s21-9 23-26l17-150c6-29 5-53-7-71-18 9-48 9-66 0z" fill="#edf3f3" stroke="#91aeb1" stroke-width="2.5"/>
        <path d="M63 38q17-11 34 0l-4 25Q80 76 67 63z" fill="#d5e7e5" stroke="#7c9ea0" stroke-width="2"/>
        <path d="M80 62v46c-13 17-13 46 0 68v71M80 108c13 17 13 46 0 68" fill="none" stroke="#087f83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="80" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="80" cy="247" r="6" fill="#fff" stroke="#c7554b" stroke-width="3"/>
      </g>
      <text x="22" y="270" fill="#526778" font-size="15" font-weight="700">Divide, then rejoin</text>
    </g>

    <g transform="translate(858 246)">
      <rect width="242" height="292" rx="18" fill="#ffffff" stroke="#d8e5e4"/>
      <text x="22" y="35" fill="#087f83" font-size="15" font-weight="800" letter-spacing="2">TYPE IV</text>
      <text x="193" y="36" fill="#176b6e" font-size="17" font-weight="800">2-2</text>
      <g transform="translate(41 48) scale(.72)">
        <path d="M47 13C35 31 34 55 40 84l17 150c2 17 12 26 23 26s21-9 23-26l17-150c6-29 5-53-7-71-18 9-48 9-66 0z" fill="#edf3f3" stroke="#91aeb1" stroke-width="2.5"/>
        <path d="M63 38q17-11 34 0l-4 25Q80 76 67 63z" fill="#d5e7e5" stroke="#7c9ea0" stroke-width="2"/>
        <path d="M68 62c1 46 1 128 0 185M92 62c-1 46-1 128 0 185" fill="none" stroke="#087f83" stroke-width="7" stroke-linecap="round"/>
        <circle cx="68" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="92" cy="62" r="5.5" fill="#102b3b" stroke="#fff" stroke-width="2"/>
        <circle cx="68" cy="247" r="6" fill="#fff" stroke="#c7554b" stroke-width="3"/>
        <circle cx="92" cy="247" r="6" fill="#fff" stroke="#c7554b" stroke-width="3"/>
      </g>
      <text x="22" y="270" fill="#526778" font-size="15" font-weight="700">Two canals, two exits</text>
    </g>

    <text x="72" y="588" fill="#6b7d87" font-size="15">Original EndoTech NZ schematics · simplified and not to scale</text>
    <text x="1100" y="588" fill="#087f83" font-size="15" font-weight="800" text-anchor="end">8 TYPES →</text>
  </g>
</svg>
