<svg xmlns="http://www.w3.org/2000/svg" width="580" height="485" viewBox="20 95 580 485" role="img" aria-labelledby="title desc"><title id="title">Cross-sections comparing a round preparation within an oval distal canal and two canals connected by an isthmus</title><desc id="desc">Original EndoTech educational schematic. Simplified anatomy; not a patient image or a scale drawing.</desc><style>text{font-family:Arial,sans-serif;fill:#173b46}.heading{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px;fill:#46616b}.canal{fill:none;stroke:#117b80;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.tooth{fill:#fff;stroke:#a9bbc2;stroke-width:3}.floor{fill:#e4eeec;stroke:#9eb7b0;stroke-width:2}.guide{stroke:#91b6b5;stroke-width:2;stroke-dasharray:7 7;fill:none}.orifice{fill:#125961;stroke:#fff;stroke-width:3}.accent{fill:#bd4c43}.note{font-size:19px;fill:#607780}</style><rect width="100%" height="100%" rx="24" fill="#f1f6f6"/><text x="54" y="58" class="heading" text-anchor="start">A round preparation can leave the ends of a flat canal untouched.</text><g transform="translate(50 0)"><ellipse class="tooth" cx="250" cy="295" rx="140" ry="193"/><path d="M230 162Q250 135 270 162L279 420Q250 465 221 420Z" fill="#95cdc6"/><circle cx="250" cy="295" r="47" fill="#117b80"/><path d="M290 179L391 151M289 418L391 445" stroke="#bd4c43" stroke-width="2"/><text x="397" y="157" class="small" text-anchor="start">Buccal fin</text><text x="397" y="450" class="small" text-anchor="start">Lingual fin</text><text x="250" y="554" class="label" text-anchor="middle">Round instrument in an oval space</text></g><g transform="translate(640 0)"><ellipse class="tooth" cx="250" cy="295" rx="140" ry="193"/><path d="M250 201V390" stroke="#95cdc6" stroke-width="24"/><circle cx="250" cy="201" r="34" fill="#117b80"/><circle cx="250" cy="390" r="34" fill="#117b80"/><path d="M270 296H397" stroke="#bd4c43" stroke-width="2"/><text x="405" y="304" class="small" text-anchor="start">Isthmus</text><text x="250" y="554" class="label" text-anchor="middle">Two canals with a connecting isthmus</text></g><text x="600" y="614" class="note" text-anchor="middle">Cross-sections · Dentine surrounds the green pulp space · Dark teal shows a round preparation</text></svg>