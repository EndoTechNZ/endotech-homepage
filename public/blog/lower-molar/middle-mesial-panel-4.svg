<svg xmlns="http://www.w3.org/2000/svg" width="240" height="475" viewBox="960 95 240 475" role="img" aria-labelledby="title desc"><title id="title">Middle mesial search zone and independent, confluent and fin configurations</title><desc id="desc">Original EndoTech educational schematic. Simplified anatomy; not a patient image or a scale drawing.</desc><style>text{font-family:Arial,sans-serif;fill:#173b46}.heading{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px;fill:#46616b}.canal{fill:none;stroke:#117b80;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.tooth{fill:#fff;stroke:#a9bbc2;stroke-width:3}.floor{fill:#e4eeec;stroke:#9eb7b0;stroke-width:2}.guide{stroke:#91b6b5;stroke-width:2;stroke-dasharray:7 7;fill:none}.orifice{fill:#125961;stroke:#fff;stroke-width:3}.accent{fill:#bd4c43}.note{font-size:19px;fill:#607780}</style><rect width="100%" height="100%" rx="24" fill="#f1f6f6"/><text x="54" y="58" class="heading" text-anchor="start">Inspect the groove between MB and ML for a middle mesial opening.</text><g transform="translate(65 110)"><path class="tooth" d="M65 40Q210 3 315 62Q370 160 315 281Q204 337 65 294Q8 163 65 40Z"/><path d="M160 98V244" stroke="#a7cfc8" stroke-width="15"/><circle class="orifice" cx="160" cy="98" r="21"/><circle class="orifice" cx="160" cy="244" r="21"/><circle cx="160" cy="171" r="10" fill="#bd4c43"/><text x="193" y="104" class="label" text-anchor="start">MB</text><text x="193" y="252" class="label" text-anchor="start">ML</text><text x="193" y="179" class="label" text-anchor="start">MM?</text></g><g transform="translate(490 0)"><path class="tooth" d="M17 125Q83 91 150 125L140 285L120 450Q83 490 46 450L25 285Z"/><path class="canal" style="stroke-width:8" d="M42 147Q29 266 46 450M125 147Q142 266 120 450"/><path d="M83 147V470" stroke="#bd4c43" stroke-width="8" stroke-linecap="round" fill="none"/><text x="83" y="548" class="label" text-anchor="middle">Independent</text></g><g transform="translate(735 0)"><path class="tooth" d="M17 125Q83 91 150 125L140 285L120 450Q83 490 46 450L25 285Z"/><path class="canal" style="stroke-width:8" d="M42 147Q29 266 46 450M125 147Q142 266 120 450"/><path d="M83 147Q88 260 125 335" stroke="#bd4c43" stroke-width="8" stroke-linecap="round" fill="none"/><text x="83" y="548" class="label" text-anchor="middle">Confluent</text></g><g transform="translate(980 0)"><path class="tooth" d="M17 125Q83 91 150 125L140 285L120 450Q83 490 46 450L25 285Z"/><path d="M42 147H124V211H42Z" fill="#95cdc6"/><path class="canal" style="stroke-width:8" d="M42 147Q29 266 46 450M125 147Q142 266 120 450"/><path d="M83 147V470" stroke="#bd4c43" stroke-width="8" stroke-linecap="round" fill="none"/><text x="83" y="548" class="label" text-anchor="middle">Fin</text></g><text x="600" y="610" class="note" text-anchor="middle">MM middle mesial · A groove, a fin and a separate canal are different findings</text></svg>