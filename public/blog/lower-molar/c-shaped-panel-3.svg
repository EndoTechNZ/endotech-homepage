<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="800 95 400 480" role="img" aria-labelledby="title desc"><title id="title">C-shaped canal systems can show continuous, interrupted or separate spaces at different levels</title><desc id="desc">Original EndoTech educational schematic. Simplified anatomy; not a patient image or a scale drawing.</desc><style>text{font-family:Arial,sans-serif;fill:#173b46}.heading{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px;fill:#46616b}.canal{fill:none;stroke:#117b80;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.tooth{fill:#fff;stroke:#a9bbc2;stroke-width:3}.floor{fill:#e4eeec;stroke:#9eb7b0;stroke-width:2}.guide{stroke:#91b6b5;stroke-width:2;stroke-dasharray:7 7;fill:none}.orifice{fill:#125961;stroke:#fff;stroke-width:3}.accent{fill:#bd4c43}.note{font-size:19px;fill:#607780}</style><rect width="100%" height="100%" rx="24" fill="#f1f6f6"/><text x="54" y="58" class="heading" text-anchor="start">C-shaped anatomy can change along the root.</text><g transform="translate(40 0)"><path class="tooth" d="M106 126Q198 91 279 146Q327 279 273 431Q176 488 100 425Q43 277 106 126Z"/><path d="M242 172C108 113 73 395 242 418" class="canal" style="stroke-width:30"/><text x="188" y="549" class="label" text-anchor="middle">Continuous C</text></g><g transform="translate(440 0)"><path class="tooth" d="M106 126Q198 91 279 146Q327 279 273 431Q176 488 100 425Q43 277 106 126Z"/><path d="M242 172C127 124 110 253 126 301" class="canal" style="stroke-width:30"/><path d="M150 357Q180 410 242 418" class="canal" style="stroke-width:30"/><text x="188" y="549" class="label" text-anchor="middle">Interrupted C</text></g><g transform="translate(840 0)"><path class="tooth" d="M106 126Q198 91 279 146Q327 279 273 431Q176 488 100 425Q43 277 106 126Z"/><path d="M144 207L136 245" class="canal" style="stroke-width:30"/><path d="M152 357L183 389" class="canal" style="stroke-width:30"/><path d="M251 275L250 330" class="canal" style="stroke-width:30"/><text x="188" y="549" class="label" text-anchor="middle">Separate spaces</text></g><text x="600" y="612" class="note" text-anchor="middle">Conceptual cross-sections at different levels · A round opening does not exclude a C-shaped system</text></svg>