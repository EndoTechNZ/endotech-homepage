<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Three lower molar chamber-floor maps: three entries, four entries, and a possible missed distal opening</title><desc id="desc">Original EndoTech educational schematic. Simplified anatomy; not a patient image or a scale drawing.</desc><style>text{font-family:Arial,sans-serif;fill:#173b46}.heading{font-size:27px;font-weight:700}.label{font-size:23px;font-weight:700}.small{font-size:20px;fill:#46616b}.canal{fill:none;stroke:#117b80;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.tooth{fill:#fff;stroke:#a9bbc2;stroke-width:3}.floor{fill:#e4eeec;stroke:#9eb7b0;stroke-width:2}.guide{stroke:#91b6b5;stroke-width:2;stroke-dasharray:7 7;fill:none}.orifice{fill:#125961;stroke:#fff;stroke-width:3}.accent{fill:#bd4c43}.note{font-size:19px;fill:#607780}</style><rect width="100%" height="100%" rx="24" fill="#f1f6f6"/><text x="198" y="63" class="heading" text-anchor="middle">01 / Three entries</text><g transform="translate(38 110)"><path class="tooth" d="M53 72Q67 25 115 42Q155 13 196 43Q239 20 260 61Q289 102 269 146Q287 197 255 231Q233 272 190 251Q152 278 112 254Q61 270 44 225Q17 185 39 142Q17 101 53 72Z"/><path class="floor" d="M95 102Q130 85 166 100L228 114Q247 146 228 187L167 206Q130 222 94 207Z"/><path class="guide" d="M67 154H260"/><text x="31" y="160" class="label" text-anchor="start">M</text><text x="273" y="160" class="label" text-anchor="start">D</text><text x="156" y="12" class="label" text-anchor="start">B</text><text x="156" y="304" class="label" text-anchor="start">L</text><path d="M100 110L214 154L100 202" fill="none" stroke="#8ba8a3" stroke-width="3"/><ellipse cx="214" cy="154" rx="12" ry="29" class="orifice"/><circle class="orifice" cx="100" cy="110" r="10"/><text x="74" y="95" class="label" text-anchor="start">MB</text><circle class="orifice" cx="100" cy="202" r="10"/><text x="74" y="237" class="label" text-anchor="start">ML</text></g><text x="198" y="492" class="small" text-anchor="middle">MB + ML + one distal opening</text><text x="198" y="526" class="small" text-anchor="middle">A broad distal opening may hide fins.</text><text x="596" y="63" class="heading" text-anchor="middle">02 / Four entries</text><g transform="translate(436 110)"><path class="tooth" d="M53 72Q67 25 115 42Q155 13 196 43Q239 20 260 61Q289 102 269 146Q287 197 255 231Q233 272 190 251Q152 278 112 254Q61 270 44 225Q17 185 39 142Q17 101 53 72Z"/><path class="floor" d="M95 102Q130 85 166 100L228 114Q247 146 228 187L167 206Q130 222 94 207Z"/><path class="guide" d="M67 154H260"/><text x="31" y="160" class="label" text-anchor="start">M</text><text x="273" y="160" class="label" text-anchor="start">D</text><text x="156" y="12" class="label" text-anchor="start">B</text><text x="156" y="304" class="label" text-anchor="start">L</text><path d="M100 110H220V202H100Z" fill="none" stroke="#8ba8a3" stroke-width="3"/><circle class="orifice" cx="100" cy="110" r="10"/><text x="74" y="95" class="label" text-anchor="start">MB</text><circle class="orifice" cx="100" cy="202" r="10"/><text x="74" y="237" class="label" text-anchor="start">ML</text><circle class="orifice" cx="220" cy="110" r="10"/><text x="236" y="95" class="label" text-anchor="start">DB</text><circle class="orifice" cx="220" cy="202" r="10"/><text x="236" y="237" class="label" text-anchor="start">DL</text></g><text x="596" y="492" class="small" text-anchor="middle">MB + ML + DB + DL</text><text x="596" y="526" class="small" text-anchor="middle">Check both ends of the distal wall.</text><text x="994" y="63" class="heading" text-anchor="middle">03 / An off-centre clue</text><g transform="translate(834 110)"><path class="tooth" d="M53 72Q67 25 115 42Q155 13 196 43Q239 20 260 61Q289 102 269 146Q287 197 255 231Q233 272 190 251Q152 278 112 254Q61 270 44 225Q17 185 39 142Q17 101 53 72Z"/><path class="floor" d="M95 102Q130 85 166 100L228 114Q247 146 228 187L167 206Q130 222 94 207Z"/><path class="guide" d="M67 154H260"/><text x="31" y="160" class="label" text-anchor="start">M</text><text x="273" y="160" class="label" text-anchor="start">D</text><text x="156" y="12" class="label" text-anchor="start">B</text><text x="156" y="304" class="label" text-anchor="start">L</text><path d="M100 110H220V202H100Z" fill="none" stroke="#8ba8a3" stroke-width="3"/><circle cx="220" cy="202" r="15" fill="none" stroke="#bd4c43" stroke-width="3" stroke-dasharray="6 4"/><text x="241" y="236" class="label" text-anchor="start">DL?</text><circle class="orifice" cx="100" cy="110" r="10"/><text x="74" y="95" class="label" text-anchor="start">MB</text><circle class="orifice" cx="100" cy="202" r="10"/><text x="74" y="237" class="label" text-anchor="start">ML</text><circle class="orifice" cx="220" cy="110" r="10"/><text x="236" y="95" class="label" text-anchor="start">DB</text></g><text x="994" y="492" class="small" text-anchor="middle">One distal opening sits to one side.</text><text x="994" y="526" class="small" text-anchor="middle">Reinspect the opposite end.</text><text x="600" y="612" class="note" text-anchor="middle">Occlusal chamber-floor views · M mesial / D distal / B buccal / L lingual</text></svg>