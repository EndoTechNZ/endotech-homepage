name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: github-pages
      PUBLIC_SITE_URL: https://endotechnz.com
      PUBLIC_QUOTE_REQUEST_SUBMISSION_ENABLED: "true"
      PUBLIC_QUOTE_REQUEST_ENDPOINT: https://endotechsg.com/.netlify/functions/nz-quote-request
      PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}
      PUBLIC_CLARITY_PROJECT_ID: ${{ vars.PUBLIC_CLARITY_PROJECT_ID }}
      SHOPIFY_STORE_DOMAIN: ${{ vars.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_STOREFRONT_API_VERSION: ${{ vars.SHOPIFY_STOREFRONT_API_VERSION }}
      SHOPIFY_STOREFRONT_PUBLIC_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
      SHOPIFY_STOREFRONT_PRIVATE_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PRIVATE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:github

      - name: Install navigation test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check published navigation at mobile and desktop widths
        run: npm run check:navigation-layout

      - name: Check mobile molar playback stays visible
        env:
          MOLAR_MODELS: "7"
          MOLAR_RAF_LAG_MS: "80"
        run: node scripts/validate-molar-mobile-playback.mjs

      - name: Check phone pulp and preparation colours
        env:
          MOLAR_RENDER_MODELS: "1"
        run: node scripts/validate-molar-rendering.mjs

      - name: Check molar lessons always open unprepared
        env:
          MOLAR_ENTRY_MODELS: "1,7"
        run: node scripts/validate-molar-entry.mjs

      - name: Check prepared surface colours through rotation
        env:
          MOLAR_ROTATION_MODELS: "1,7"
          MOLAR_ROTATION_COURSES: "1,19"
          MOLAR_ROTATION_ANGLES: "0,180,210"
          MOLAR_ROTATION_PROFILES: "native"
        run: node scripts/validate-molar-rotation.mjs

      - name: Save navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-layout
          path: |
            output/playwright/navigation/
            output/playwright/molar-mobile/
            output/playwright/molar-rendering/
            output/playwright/molar-entry/
            output/playwright/molar-rotation/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
